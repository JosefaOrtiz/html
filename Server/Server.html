<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Server</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;--bg:#080a0e;--panel:#10141b;--border:#293343;--text:#edf2f7;--muted:#8e9bad;--ok:#70df94;--warn:#f1c75b;--bad:#ff7373}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text)}main{width:min(1300px,96vw);margin:20px auto 60px}h1{margin-bottom:4px}small{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;margin-top:18px}.card{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:15px}.label{color:var(--muted);font-size:13px}.value{font-size:22px;font-weight:700;margin-top:5px;word-break:break-word}.ok{color:var(--ok)}.warn{color:var(--warn)}.bad{color:var(--bad)}.controls{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}button,input{font:inherit}button{border:1px solid #344155;background:#192230;color:white;padding:9px 13px;border-radius:6px;cursor:pointer}button:hover{background:#243145}input{border:1px solid var(--border);background:#090c11;color:white;padding:9px;border-radius:6px}pre{height:360px;margin:0;padding:12px;overflow:auto;background:#050609;border:1px solid #202936;border-radius:7px;white-space:pre-wrap}table{width:100%;border-collapse:collapse}td,th{padding:7px;border-bottom:1px solid #252e3b;text-align:left}.code{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}
</style>
</head>
<body>
<main>
<h1>Server</h1>
<small>HTML cliente + servidor Node real + persistencia + cola + watchdog + recuperación automática</small>
<div class="grid">
<section class="card"><div class="label">Runtime</div><div id="runtime" class="value">...</div></section>
<section class="card"><div class="label">Servidor</div><div id="serverStatus" class="value warn">INICIALIZANDO</div></section>
<section class="card"><div class="label">Dirección</div><div id="serverAddress" class="value code">—</div></section>
<section class="card"><div class="label">Uptime</div><div id="uptime" class="value">0 s</div></section>
<section class="card"><div class="label">Peticiones HTTP</div><div id="requests" class="value">0</div></section>
<section class="card"><div class="label">Trabajos terminados</div><div id="jobsFinished" class="value">0</div></section>
<section class="card"><div class="label">Errores</div><div id="errors" class="value">0</div></section>
<section class="card"><div class="label">Recuperaciones</div><div id="recoveries" class="value">0</div></section>
</div>
<section class="card" style="margin-top:12px"><strong>API persistente</strong><div class="controls"><input id="key" placeholder="clave" value="prueba"><input id="value" placeholder="valor" value="123"><button onclick="putValue()">Guardar</button><button onclick="getValue()">Leer</button><button onclick="deleteValue()">Eliminar</button></div></section>
<section class="card" style="margin-top:12px"><strong>Cola de trabajos</strong><div class="controls"><button onclick="addJob()">Agregar trabajo</button><button onclick="loadJobs()">Actualizar cola</button><button onclick="createSnapshot()">Snapshot</button><button onclick="forceStateSave()">Guardar estado</button></div><div style="overflow:auto;margin-top:12px"><table><thead><tr><th>ID</th><th>Estado</th><th>Intentos</th><th>Creado</th></tr></thead><tbody id="jobTable"></tbody></table></div></section>
<section class="card" style="margin-top:12px"><strong>Log del sistema</strong><div class="controls"><button onclick="refreshHealth()">Health</button><button onclick="clearUILog()">Limpiar vista</button></div><pre id="log"></pre></section>
</main>
<script>
"use strict";
const API_BASE=location.protocol.startsWith("http")?"":"http://127.0.0.1:8787";
function log(level,...values){const ui=document.getElementById("log");const line=`[${new Date().toISOString()}] [${level}] ${values.map(v=>typeof v==="string"?v:JSON.stringify(v)).join(" ")}`;console.log(line);if(ui){ui.textContent+=line+"\n";ui.scrollTop=ui.scrollHeight}}
async function requestAPI(method,path,data){const r=await fetch(API_BASE+path,{method,headers:{"Content-Type":"application/json"},body:data===undefined?undefined:JSON.stringify(data)});const text=await r.text();let out=null;try{out=text?JSON.parse(text):null}catch{out={raw:text}}if(!r.ok)throw new Error(out?.message||out?.error||`HTTP ${r.status}`);return out}
async function putValue(){try{const k=document.getElementById("key").value,v=document.getElementById("value").value;log("UI","PUT",await requestAPI("PUT","/api/kv/"+encodeURIComponent(k),v))}catch(e){log("UI_ERROR",e.message)}}
async function getValue(){try{const k=document.getElementById("key").value;log("UI","GET",await requestAPI("GET","/api/kv/"+encodeURIComponent(k)))}catch(e){log("UI_ERROR",e.message)}}
async function deleteValue(){try{const k=document.getElementById("key").value;log("UI","DELETE",await requestAPI("DELETE","/api/kv/"+encodeURIComponent(k)))}catch(e){log("UI_ERROR",e.message)}}
async function addJob(){try{const r=await requestAPI("POST","/api/jobs",{uuid:crypto.randomUUID?.()||String(Date.now()),timestamp:Date.now(),example:"server-job"});log("UI","job creado",r.id);await loadJobs()}catch(e){log("UI_ERROR",e.message)}}
async function loadJobs(){try{renderJobs(await requestAPI("GET","/api/jobs"))}catch(e){log("UI_ERROR",e.message)}}
function renderJobs(jobs){const tbody=document.getElementById("jobTable");tbody.textContent="";for(const job of jobs.slice().reverse().slice(0,50)){const tr=document.createElement("tr");tr.innerHTML=`<td>${escapeHTML(job.id)}</td><td>${escapeHTML(job.status)}</td><td>${escapeHTML(job.attempts||0)}</td><td>${new Date(job.createdAt).toLocaleString()}</td>`;tbody.appendChild(tr)}}
async function refreshHealth(){try{const h=await requestAPI("GET","/api/health");log("HEALTH",h);applyHealth(h)}catch(e){applyOffline(e.message)}}
function applyHealth(h){document.getElementById("runtime").textContent=h.nodeVersion?`Node ${h.nodeVersion}`:"Node";const s=document.getElementById("serverStatus");s.textContent="ONLINE";s.className="value ok";document.getElementById("serverAddress").textContent=h.address||"http://127.0.0.1:8787";document.getElementById("uptime").textContent=Math.floor(h.uptimeMs/1000)+" s";document.getElementById("requests").textContent=h.requests;document.getElementById("jobsFinished").textContent=h.jobsFinished;document.getElementById("errors").textContent=h.errors;document.getElementById("recoveries").textContent=h.recoveries}
function applyOffline(msg){document.getElementById("runtime").textContent="Browser client";const s=document.getElementById("serverStatus");s.textContent="OFFLINE";s.className="value bad";document.getElementById("serverAddress").textContent=API_BASE||location.origin;if(msg)log("SERVER",msg)}
async function createSnapshot(){try{log("SNAPSHOT",await requestAPI("POST","/api/snapshot",{}))}catch(e){log("UI_ERROR",e.message)}}
async function forceStateSave(){try{log("STATE",await requestAPI("POST","/api/state/save",{}))}catch(e){log("UI_ERROR",e.message)}}
function clearUILog(){document.getElementById("log").textContent=""}
function escapeHTML(value){return String(value).replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;")}
setInterval(refreshHealth,1000);setInterval(loadJobs,2000);refreshHealth();loadJobs();
</script>
</body>
</html>
